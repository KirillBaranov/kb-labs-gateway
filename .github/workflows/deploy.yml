name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Replace link deps with npm versions
        run: |
          find . -name "package.json" \
            ! -path "*/node_modules/*" \
            ! -path "./.github/*" \
            | xargs sed -i \
              -e 's|"link:[^"]*"|"*"|g' \
              -e 's|"workspace:\*"|"*"|g'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @kb-labs/gateway-app... run build

      - name: Prepare deploy bundle
        run: |
          pnpm --filter @kb-labs/gateway-app deploy --prod deploy-bundle
          cp kb.config.production.json deploy-bundle/kb.config.json

      - name: Generate marketplace.lock for deploy bundle
        run: |
          mkdir -p deploy-bundle/.kb
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const bundleDir = 'deploy-bundle';
          const nmDir = path.join(bundleDir, 'node_modules');
          // Scan all @kb-labs/adapters-* packages in node_modules and emit
          // a marketplace.lock pointing at their real on-disk location.
          //
          // NOTE: this is a temporary derivation step that will be replaced
          // by \`kb platform lock --for-prod\` (Phase 6 of the platform-sync
          // plan). Until then, integrity is computed from package.json so
          // the validate step below can verify the bundle wasn't tampered
          // with after lock generation.
          const installed = {};
          const kbDir = path.join(nmDir, '@kb-labs');
          if (fs.existsSync(kbDir)) {
            for (const name of fs.readdirSync(kbDir)) {
              if (!name.startsWith('adapters-')) continue;
              const pkgDir = path.join(kbDir, name);
              const pkgJsonPath = path.join(pkgDir, 'package.json');
              if (!fs.existsSync(pkgJsonPath)) continue;
              const pkgJsonBuf = fs.readFileSync(pkgJsonPath);
              const pkgJson = JSON.parse(pkgJsonBuf.toString('utf8'));
              const integrity = 'sha256-' + crypto.createHash('sha256').update(pkgJsonBuf).digest('base64');
              installed[pkgJson.name] = {
                version: pkgJson.version || '0.0.0',
                integrity,
                resolvedPath: './' + path.relative(bundleDir, pkgDir),
                installedAt: new Date().toISOString(),
                source: 'marketplace',
                primaryKind: 'adapter',
                provides: ['adapter'],
                enabled: true,
              };
            }
          }
          const lock = { schema: 'kb.marketplace/2', installed };
          fs.writeFileSync('deploy-bundle/.kb/marketplace.lock', JSON.stringify(lock, null, 2));
          console.log('marketplace.lock written:', Object.keys(installed));
          "

      - name: Validate deploy bundle against marketplace.lock
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const bundleDir = 'deploy-bundle';
          const lockPath = path.join(bundleDir, '.kb', 'marketplace.lock');
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const missing = [];
          const mismatched = [];
          for (const [id, entry] of Object.entries(lock.installed)) {
            const abs = path.resolve(bundleDir, entry.resolvedPath);
            const pkgJsonPath = path.join(abs, 'package.json');
            if (!fs.existsSync(pkgJsonPath)) {
              missing.push(id);
              continue;
            }
            if (entry.integrity) {
              const computed = 'sha256-' + crypto.createHash('sha256').update(fs.readFileSync(pkgJsonPath)).digest('base64');
              if (computed !== entry.integrity) {
                mismatched.push({ id, expected: entry.integrity, computed });
              }
            }
          }
          const total = Object.keys(lock.installed).length;
          console.log('validated ' + total + ' entries');
          if (missing.length || mismatched.length) {
            console.error('DEPLOY BUNDLE IS INCONSISTENT WITH LOCK');
            if (missing.length) console.error('  missing:', missing);
            if (mismatched.length) console.error('  integrity mismatch:', mismatched);
            process.exit(1);
          }
          console.log('deploy-bundle OK');
          "

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: deploy-bundle
          file: Dockerfile
          push: true
          tags: ghcr.io/kirillbaranov/kb-labs-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/kirillbaranov/kb-labs-gateway:latest
            docker stop kb-labs-gateway 2>/dev/null || true
            docker rm kb-labs-gateway 2>/dev/null || true
            docker run -d \
              --name kb-labs-gateway \
              --restart unless-stopped \
              -p 4000:4000 \
              -e NODE_ENV=production \
              -e GATEWAY_JWT_SECRET=${{ secrets.GATEWAY_JWT_SECRET }} \
              -e GATEWAY_INTERNAL_SECRET=${{ secrets.GATEWAY_INTERNAL_SECRET }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              ghcr.io/kirillbaranov/kb-labs-gateway:latest
            docker image prune -f
