name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Replace link deps with npm versions
        run: |
          find . -name "package.json" \
            ! -path "*/node_modules/*" \
            ! -path "./.github/*" \
            | xargs sed -i \
              -e 's|"link:[^"]*"|"*"|g' \
              -e 's|"workspace:\*"|"*"|g'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @kb-labs/gateway-app... run build

      - name: Prepare deploy bundle
        run: |
          pnpm --filter @kb-labs/gateway-app deploy --prod deploy-bundle
          cp kb.config.production.json deploy-bundle/kb.config.json

      - name: Generate marketplace.lock for adapters
        run: |
          mkdir -p deploy-bundle/.kb
          node -e "
          const fs = require('fs');
          const path = require('path');
          const bundleDir = 'deploy-bundle';
          const nmDir = path.join(bundleDir, 'node_modules');
          const adapters = ['@kb-labs/adapters-openai'];
          const installed = {};
          for (const pkg of adapters) {
            const pkgDir = path.join(nmDir, ...pkg.split('/'));
            const pkgJson = JSON.parse(fs.readFileSync(path.join(pkgDir, 'package.json'), 'utf8'));
            const relPath = path.relative(bundleDir, pkgDir);
            installed[pkg] = {
              version: pkgJson.version,
              integrity: '',
              resolvedPath: relPath,
              installedAt: new Date().toISOString(),
              source: 'marketplace',
              primaryKind: 'adapter',
              provides: ['adapter'],
              enabled: true,
            };
          }
          const lock = { schema: 'kb.marketplace/2', installed };
          fs.writeFileSync('deploy-bundle/.kb/marketplace.lock', JSON.stringify(lock, null, 2));
          console.log('marketplace.lock written:', Object.keys(installed));
          "

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: deploy-bundle
          file: Dockerfile
          push: true
          tags: ghcr.io/kirillbaranov/kb-labs-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/kirillbaranov/kb-labs-gateway:latest
            docker stop kb-labs-gateway 2>/dev/null || true
            docker rm kb-labs-gateway 2>/dev/null || true
            docker run -d \
              --name kb-labs-gateway \
              --restart unless-stopped \
              -p 4000:4000 \
              -e NODE_ENV=production \
              -e GATEWAY_JWT_SECRET=${{ secrets.GATEWAY_JWT_SECRET }} \
              -e GATEWAY_INTERNAL_SECRET=${{ secrets.GATEWAY_INTERNAL_SECRET }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              ghcr.io/kirillbaranov/kb-labs-gateway:latest
            docker image prune -f
